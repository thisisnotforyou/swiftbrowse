<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; form-action https://www.google.com">
  <title>New tab</title><link rel="stylesheet" href="start.css">
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<main class="home">
  <header class="home-top"><div class="mini-brand"><span class="mini-mark">S</span><span>SWIFTBROWSE</span></div><div class="private-note"><span class="live-dot"></span> YOUR SPACE, YOUR RULES</div></header>
  <section class="hero">
    <div class="time-block"><span id="greeting">GOOD DAY</span><time id="clock">09:41</time><span id="date">MONDAY, OCTOBER 19</span></div>
    <div class="hero-copy"><div class="eyebrow">A FASTER WAY AROUND THE WEB</div><h1>Where to<br><span>next?</span></h1><p>Search the web or enter an address.</p></div>
    <form id="search-form" class="search"><span class="search-glyph">⌕</span><input id="query" name="q" autofocus autocomplete="off" placeholder="Search Google or enter a URL"><button type="submit">Search <span>↗</span></button></form>
    <div class="shortcuts" aria-label="Quick links">
      <a class="shortcut shortcut-purple" href="https://www.youtube.com"><span class="shortcut-icon">▶</span><span>YouTube</span><small>WATCH</small></a>
      <a class="shortcut shortcut-blue" href="https://www.wikipedia.org"><span class="shortcut-icon">W</span><span>Wikipedia</span><small>EXPLORE</small></a>
      <a class="shortcut shortcut-green" href="https://github.com"><span class="shortcut-icon">⌘</span><span>GitHub</span><small>BUILD</small></a>
      <a class="shortcut shortcut-pink" href="https://www.reddit.com"><span class="shortcut-icon">◉</span><span>Reddit</span><small>DISCOVER</small></a>
    </div>
  </section>
  <footer class="home-bottom"><div><span class="shield-small">◈</span><span>Built-in ad and tracker protection</span></div><div class="tip"><span>Ctrl / ⌘ + L</span> focus the address bar</div></footer>
</main>
<script src="start.js"></script>
</body>
</html>
